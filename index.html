<!DOCTYPE html>
<html lang="tel">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uday's To-Do List</title>
    <style>
        body {
            background-color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            color: #0284c7;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0369a1;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #f1f5f9;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Uday's Tasks 📝</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="New task rayi...">
            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let inputField = document.getElementById("taskInput");
            let taskText = inputField.value.trim();

            if (taskText === "") {
                alert("Dayachesi oka task rayi!");
                return;
            }

            // Kotha <li> element tayarichesam
            let li = document.createElement("li");
            li.innerHTML = taskText + ' <button class="delete-btn" onclick="removeTask(this)">Delete</button>';

            // List lo add chesam
            document.getElementById("taskList").appendChild(li);

            // Input box clear cheyyadaniki
            inputField.value = "";
        }

        function removeTask(button) {
            button.parentElement.remove();
        }
    </script>

</body>
</html>
