<!DOCTYPE html>
<html lang="tel">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator - Uday's Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quote-card {
            background-color: #1e293b;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #38bdf8;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .quote-text {
            font-size: 18px;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e2e8f0;
            min-height: 80px;
        }
        .quote-author {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .generate-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        .generate-btn:hover {
            background-color: #0369a1;
        }
        .back-btn {
            display: block;
            margin-top: 25px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="quote-card">
        <h1>Daily Inspiration 💡</h1>
        
        <div class="quote-text" id="quoteText">
            "The secret of getting ahead is getting started."
        </div>
        <div class="quote-author" id="quoteAuthor">
            - Mark Twain
        </div>

        <button class="generate-btn" onclick="generateQuote()">New Quote</button>

        <a href="index.html" class="back-btn">← Back to Portfolio</a>
    </div>

    <script>
        const quotes = [
            { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
            { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
            { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
            { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
            { text: "Success is not final; failure is not fatal: It is the courage to continue that counts.", author: "Winston Churchill" },
            { text: "Code is like humor. When you have to explain it, it’s bad.", author: "Cory House" }
        ];

        function generateQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const selectedQuote = quotes[randomIndex];
            
            document.getElementById('quoteText').textContent = `"${selectedQuote.text}"`;
            document.getElementById('quoteAuthor').textContent = `- ${selectedQuote.author}`;
        }
    </script>

</body>
</html>
<div class="section-item">
                <span>Quote Generator (JS)</span>
                <a href="quote.html" class="btn" target="_blank">View Live</a>
            </div>
